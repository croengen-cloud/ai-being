<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Being</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <style>
    :root {
      --ink: #4a3f6b;
      --paper: #fffaf3;
      --accent: #ff8fab;
      --accent-dark: #e86f8f;
      --sky: #7fd8ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #2b2640;
      font-family: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
      color: var(--ink);
    }
    #app { position: fixed; inset: 0; display: grid; place-items: center; }

    #stage {
      position: relative; width: 100vw; height: 100vh; overflow: hidden;
      container-type: size;
      background: linear-gradient(180deg, #a8c8ff, #ffd6c9);
    }
    #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* ---------- HUD ---------- */
    #hud-top { position: absolute; top: 3cqmin; left: 3.5cqmin; pointer-events: none; z-index: 5; }
    #day-counter {
      font-weight: 700; font-size: 11cqmin; line-height: 0.95; letter-spacing: 0.02em;
      color: #fff;
      -webkit-text-stroke: 0.45cqmin var(--ink); paint-order: stroke fill;
      text-shadow: 0 0.7cqmin 0 rgba(74, 63, 107, 0.35);
    }
    #day-counter.pop { animation: pop 0.6s cubic-bezier(.2, 1.6, .4, 1); }
    @keyframes pop { 0% { transform: scale(0.6); } 100% { transform: scale(1); } }
    #status {
      display: inline-block; margin-top: 1.2cqmin; padding: 0.5em 0.9em;
      font-size: 2.4cqmin; font-weight: 600;
      background: rgba(255, 250, 243, 0.88); border-radius: 999px;
      box-shadow: 0 0.4cqmin 0 rgba(74, 63, 107, 0.15);
    }

    /* ---------- Location labels ---------- */
    #labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
    .label {
      position: absolute; left: 0; top: 0;
      font-size: 1.9cqmin; font-weight: 600; white-space: nowrap;
      padding: 0.35em 0.8em; border-radius: 999px;
      background: rgba(255, 250, 243, 0.9); color: var(--ink);
      box-shadow: 0 0.3cqmin 0 rgba(74, 63, 107, 0.18);
      transition: background 0.25s, color 0.25s, scale 0.25s;
    }
    .label.active { background: var(--accent); color: #fff; scale: 1.15; }

    /* ---------- Thought bubble ---------- */
    #bubble {
      position: absolute; left: 0; top: 0; z-index: 4;
      max-width: 40cqw; padding: 1em 1.2em;
      font-size: 3cqmin; line-height: 1.3; font-weight: 500;
      background: var(--paper); border: 0.4cqmin solid var(--ink); border-radius: 1.4em;
      box-shadow: 0 0.8cqmin 0 rgba(74, 63, 107, 0.25);
      opacity: 0; scale: 0.85; transform-origin: var(--tail-x, 50%) 100%;
      transition: opacity 0.25s, scale 0.3s cubic-bezier(.2, 1.4, .4, 1);
      pointer-events: none;
    }
    #bubble.visible { opacity: 1; scale: 1; }
    #bubble::before, #bubble::after {
      content: ''; position: absolute; background: var(--paper);
      border: 0.4cqmin solid var(--ink); border-radius: 50%;
    }
    #bubble::before { width: 1.1em; height: 1.1em; left: calc(var(--tail-x, 50%) - 0.55em); bottom: -1.2em; }
    #bubble::after { width: 0.6em; height: 0.6em; left: calc(var(--tail-x, 50%) - 0.3em); bottom: -2em; }
    .bubble-meta { font-size: 0.62em; font-weight: 700; color: var(--accent-dark); margin-bottom: 0.35em; text-transform: uppercase; letter-spacing: 0.04em; }
    .bubble-text .ghost { opacity: 0; }

    /* ---------- Banner ---------- */
    #banner {
      position: absolute; inset: 0; z-index: 6; display: grid; place-content: center; text-align: center;
      background: radial-gradient(circle, rgba(43, 38, 64, 0.55), rgba(43, 38, 64, 0.15) 70%);
      opacity: 0; pointer-events: none; transition: opacity 0.45s;
    }
    #banner.visible { opacity: 1; }
    .banner-title {
      font-size: 13cqmin; font-weight: 700; color: #fff; line-height: 1;
      -webkit-text-stroke: 0.5cqmin var(--ink); paint-order: stroke fill;
      text-shadow: 0 0.8cqmin 0 rgba(74, 63, 107, 0.4);
    }
    #banner.visible .banner-title { animation: pop 0.7s cubic-bezier(.2, 1.6, .4, 1); }
    .banner-sub { margin-top: 1.5cqmin; font-size: 3cqmin; font-weight: 600; color: #fff; text-shadow: 0 0.3cqmin 0.6cqmin rgba(43, 38, 64, 0.6); padding: 0 4cqmin; }

    /* ---------- Controls ---------- */
    #controls {
      position: absolute; left: 50%; bottom: 3cqmin; translate: -50% 0; z-index: 5;
      display: flex; flex-direction: column; align-items: center; gap: 1.2cqmin;
    }
    button {
      font: inherit; font-weight: 600; color: var(--ink); cursor: pointer;
      border: 0.35cqmin solid var(--ink); border-radius: 999px;
      background: var(--paper); padding: 0.45em 1em; font-size: 1.9cqmin;
      box-shadow: 0 0.45cqmin 0 var(--ink);
      transition: translate 0.1s, box-shadow 0.1s, filter 0.2s;
    }
    button:hover { filter: brightness(1.05); }
    button:active { translate: 0 0.4cqmin; box-shadow: 0 0.05cqmin 0 var(--ink); }
    button:disabled { cursor: default; filter: saturate(0.4); opacity: 0.85; }
    button.primary { background: var(--accent); color: #fff; font-size: 3.2cqmin; padding: 0.4em 1.4em; font-weight: 700; }
    .small-row { display: flex; gap: 1cqmin; align-items: center; }
    .hint { font-size: 1.5cqmin; color: rgba(74, 63, 107, 0.75); font-weight: 600; }

    /* ---------- Diary ---------- */
    #diary {
      position: absolute; top: 3cqmin; right: 3cqmin; bottom: 3cqmin; z-index: 7;
      width: min(440px, 86cqw); display: flex; flex-direction: column;
      background: var(--paper); border: 0.35cqmin solid var(--ink); border-radius: 1.2rem;
      box-shadow: 0 0.6cqmin 0 rgba(74, 63, 107, 0.3);
      transition: translate 0.35s cubic-bezier(.3, 1.2, .5, 1), opacity 0.3s;
    }
    #diary.hidden { translate: 110% 0; opacity: 0; pointer-events: none; }
    #diary header { display: flex; justify-content: space-between; align-items: center; padding: 0.9rem 1.1rem; border-bottom: 2px dashed rgba(74, 63, 107, 0.25); }
    #diary h2 { margin: 0; font-size: 1.4rem; }
    #diary header button { font-size: 0.95rem; }
    #diary-list { overflow-y: auto; padding: 0.6rem 1.1rem 1.2rem; }
    .diary-day h3 { margin: 0.9rem 0 0.4rem; font-size: 1.05rem; color: var(--accent-dark); }
    .diary-entry { margin: 0 0 0.6rem; padding: 0.55rem 0.75rem; background: #fff; border-radius: 0.8rem; border: 1.5px solid rgba(74, 63, 107, 0.15); font-size: 0.95rem; line-height: 1.35; }
    .diary-entry .where { font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.75; }
    .diary-entry .read { font-size: 0.82rem; opacity: 0.7; margin-top: 0.25rem; font-style: italic; }
    .diary-empty { opacity: 0.7; padding: 1rem 0; }

    /* ---------- 9:16 vertical mode (TikTok) ---------- */
    .vertical #hud-top { top: 8cqh; left: 5cqmin; }
    .vertical #day-counter { font-size: 18cqmin; }
    .vertical #status { font-size: 4.2cqmin; }
    .vertical .label { font-size: 3.2cqmin; }
    .vertical #bubble { max-width: 78cqw; font-size: 4.6cqmin; }
    .vertical .banner-title { font-size: 20cqmin; }
    .vertical .banner-sub { font-size: 5cqmin; }
    .vertical #controls { bottom: 6cqh; }
    .vertical button { font-size: 3.4cqmin; }
    .vertical button.primary { font-size: 6cqmin; }
    .vertical .hint { font-size: 2.8cqmin; }

    /* Clean recording mode (press H): hide everything that isn't part of the show */
    .clean #controls { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="scene"></canvas>
      <div id="labels"></div>

      <div id="bubble" aria-live="polite">
        <div class="bubble-meta"></div>
        <div class="bubble-text"></div>
      </div>

      <div id="hud-top">
        <div id="day-counter">DAY <span id="day-num">1</span></div>
        <div id="status">Morning · at home</div>
      </div>

      <div id="banner"><div class="banner-title"></div><div class="banner-sub"></div></div>

      <div id="controls">
        <button id="btn-start" class="primary">Start Day 1</button>
        <div class="small-row">
          <button id="btn-vertical" title="Toggle 9:16 vertical canvas (V)">9:16</button>
          <button id="btn-diary" title="Open diary (D)">Diary</button>
          <button id="btn-reset" title="Delete save and start over">Reset</button>
        </div>
        <div class="hint">H hides buttons for recording · V 9:16 · Space starts the day</div>
      </div>

      <aside id="diary" class="hidden" aria-label="Diary">
        <header><h2>Diary</h2><button id="btn-diary-close">Close</button></header>
        <div id="diary-list"></div>
      </aside>
    </div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
